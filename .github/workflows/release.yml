name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install -U pip
          pip install -U platformio esptool

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        env:
          PLATFORMIO_BUILD_DIR: ${{ runner.temp }}/pio_build
        run: pio run -e m5stack-stamps3

      - name: Merge flash image
        env:
          AXIOMOS_VERSION: ${{ steps.ver.outputs.version }}
          PLATFORMIO_BUILD_DIR: ${{ runner.temp }}/pio_build
        run: python scripts/merge_firmware.py --version "$AXIOMOS_VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AxiomOS-Cardputer-ADV-v${{ steps.ver.outputs.version }}
          path: |
            dist/AxiomOS-Cardputer-ADV-v${{ steps.ver.outputs.version }}-merged.bin
            dist/AxiomOS-Cardputer-ADV-v${{ steps.ver.outputs.version }}-app.bin

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AxiomOS v${{ steps.ver.outputs.version }}
          body_path: docs/RELEASE_NOTES_v${{ steps.ver.outputs.version }}.md
          files: |
            dist/AxiomOS-Cardputer-ADV-v${{ steps.ver.outputs.version }}-merged.bin
            dist/AxiomOS-Cardputer-ADV-v${{ steps.ver.outputs.version }}-app.bin
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
