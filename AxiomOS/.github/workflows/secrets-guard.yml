# Fail CI if ai_secrets.h (real secrets) is tracked. Template .example is OK.

name: secrets-guard

on:
  push:
  pull_request:

jobs:
  no-ai-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked ai_secrets.h
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)ai_secrets\.h$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Tracked secret file(s) found — only ai_secrets.h.example may be in git:"
            echo "$bad"
            exit 1
          fi
          if ! git ls-files | grep -qx 'src/modules/ai/ai_secrets.h.example'; then
            echo "::error::Missing required template src/modules/ai/ai_secrets.h.example"
            exit 1
          fi
          echo "OK: secrets file not tracked; template present."
