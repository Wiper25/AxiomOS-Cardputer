; AxiomOS Cardputer Edition
; https://github.com/Wiper25/AxiomOS-Cardputer

[platformio]
default_envs = m5stack-stamps3
; ASCII path required on Windows when the project folder contains non-ASCII chars.
; CI overrides via PLATFORMIO_BUILD_DIR.
build_dir = C:/pio_build/cardputer_adv

[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DAXIOMOS_VERSION=\"0.1.0\"
    -DAXIOM_AI=1
    -DAXIOM_VOICE=1
lib_deps =
    m5stack/M5Cardputer @ ^1.0.3
    lvgl/lvgl @ ^9.1.0
    nrf24/RF24 @ ^1.4.11
    knolleary/PubSubClient @ ^2.8
    links2004/WebSockets @ ^2.4.1
    marian-craciunescu/ESP32Ping @ ^1.7
    h2zero/NimBLE-Arduino @ ^1.4.3
