; AxiomOS Cardputer — voice-only (branch minimal)
; https://github.com/Wiper25/AxiomOS-Cardputer

[platformio]
default_envs = m5stack-stamps3
build_dir = C:/pio_build/cardputer_adv_minimal

[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAXIOMOS_VERSION=\"0.2.0-minimal\"
    -DAXIOM_AI=0
    -DAXIOM_VOICE=1
    ; Uncomment / edit to bake credentials without touching config.h:
    ; -DAXIOM_WIFI_SSID=\"MyWifi\"
    ; -DAXIOM_WIFI_PASS=\"secret\"
    ; -DAXIOM_VOICE_HOST=\"1.2.3.4\"
    ; -DAXIOM_VOICE_PORT=8090
lib_deps =
    m5stack/M5Cardputer @ ^1.0.3
    links2004/WebSockets @ ^2.4.1
